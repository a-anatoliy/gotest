# Local stack: MySQL 8 + the app. Start with: docker compose up --build
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gotest
      MYSQL_USER: gotest
      MYSQL_PASSWORD: gotest
    volumes:
      - ./init/db_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USERNAME: gotest
      DB_PASSWORD: gotest
      DB_NAME: gotest
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
