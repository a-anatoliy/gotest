name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gotest
          MYSQL_USER: gotest
          MYSQL_PASSWORD: gotest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet -tags integration ./...

      - name: Unit tests
        run: go test -race -cover ./...

      - name: Load schema
        run: mysql -h 127.0.0.1 -P 3306 -ugotest -pgotest gotest < init/db_schema.sql

      - name: Integration tests (MySQL)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USERNAME: gotest
          DB_PASSWORD: gotest
          DB_NAME: gotest
        run: go test -tags integration -race -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build linux/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o dist/gotest-linux-${{ matrix.goarch }} .

      - uses: actions/upload-artifact@v7
        with:
          name: gotest-linux-${{ matrix.goarch }}
          path: dist/gotest-linux-${{ matrix.goarch }}
